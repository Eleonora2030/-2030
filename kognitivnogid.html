<div id="root" class="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

/* ==================== Хранилище: window.storage внутри Claude, ====================
   в памяти сессии — при отдельном хостинге (там window.storage недоступен).
   localStorage сознательно не используется — это временная замена, а не постоянная. */
/* ==================== Настоящий сервер: Yandex Cloud Function + Яндекс.Диск ====================
   Разверните backend_yandex_disk.py.txt как Yandex Cloud Function (см. подробную инструкцию
   в комментарии в начале самого файла) и вставьте сюда полученную ссылку вида
   https://functions.yandexcloud.net/ВАШ_ID_ФУНКЦИИ
   Пока строка пустая — работает резервная схема (window.storage внутри Claude, иначе —
   только в рамках сессии этого браузера). */
const SERVER_URL = ""; // НЕ заполнять: в исследовании «КогнитоПульс» данные никуда не отправляются
/* Режим исследования: студент видит свой профиль и код результата, но не советы —
   советы по стилю получает только группа «Персональный план» в отчёте КогнитоПульса. */
const RESEARCH_MODE = true;
/* Код результата: три балла (0–99) и контрольная цифра, связанная с кодом участника.
   Пример: 64-38-21-7. КогнитоПульс проверяет контрольную цифру при вводе. */
function resultCode(code, p1, p2, p3) {
  const c = v => Math.max(0, Math.min(99, Math.round(v)));
  const a = c(p1), b = c(p2), d = c(p3);
  const h = String(code || '').split('').reduce((s, ch) => s + ch.charCodeAt(0), 0);
  const chk = (a + 3 * b + 7 * d + h) % 10;
  return [a, b, d].map(x => String(x).padStart(2, '0')).join('-') + '-' + chk;
}
/* Если КогнитивноГид открыт по ссылке Google-скрипта (как для студентов), он сохраняет результаты
   в Google Таблицу сам, через google.script.run — ссылку вписывать не нужно. */
const HAS_GAS = false; // отправка в Google отключена: данные остаются на устройстве участника
const SERVER_ON = !!SERVER_URL || HAS_GAS;
/* Код участника выдаёт исследователь, например Э-07. Латинские буквы-двойники заменяются на русские. */
const CODE_RE = /^[А-ЯЁ]{1,3}-\d{1,3}$/;
function normCode(c) {
  const lat = { A: 'А', B: 'В', E: 'Е', K: 'К', M: 'М', H: 'Н', O: 'О', P: 'Р', C: 'С', T: 'Т', X: 'Х', Y: 'У' };
  return String(c || '').toUpperCase().replace(/\s+/g, '').replace(/[‐-―−_]/g, '-').replace(/[ABEKMHOPCTXY]/g, ch => lat[ch]);
}

let lastServerError = null;

/* ==== Согласие на обработку персональных данных (152-ФЗ) ==== 
   Впишите сюда e-mail, по которому можно отозвать согласие: */
const PD_OPERATOR = "Свих Элеонора Эдуардовна, автор проекта «КогнитивноГид» (Поволжский ГУФКСиТ, г. Казань)";
const PD_CONTACT = "Eins.svikh@mail.ru";
/* false — вместо ФИО спрашиваем номер в списке группы (рекомендуется при хранении в Google Таблице:
   ФИО граждан РФ по 152-ФЗ должны собираться в базы данных на территории России).
   true — спрашивать ФИО (только если сервер находится в России). */
const COLLECT_FIO = false;
const ID_LABEL = COLLECT_FIO ? 'ФИО' : 'Код участника';

// Google Apps Script отвечает через JSONP (обходит ограничения CORS); другие серверы — обычный fetch.
const IS_GOOGLE = /script\.google(usercontent)?\.com/.test(SERVER_URL);
function jsonpCall(params) {
  return new Promise((resolve, reject) => {
    const cb = 'kgCb_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    const qs = Object.entries({ ...params, callback: cb })
      .map(([k, v]) => encodeURIComponent(k) + '=' + encodeURIComponent(typeof v === 'string' ? v : JSON.stringify(v))).join('&');
    const tag = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('сервер не ответил за 25 секунд')); }, 25000);
    function cleanup() { clearTimeout(timer); delete window[cb]; tag.remove(); }
    window[cb] = (data) => { cleanup(); resolve(data); };
    tag.onerror = () => { cleanup(); reject(new Error('не удалось загрузить ответ сервера')); };
    tag.src = SERVER_URL + (SERVER_URL.includes('?') ? '&' : '?') + qs;
    document.body.appendChild(tag);
  });
}
async function serverCall(payload) {
  if (HAS_GAS) return new Promise((resolve, reject) => window.google.script.run.withSuccessHandler(resolve).withFailureHandler(e => reject(new Error(e && e.message ? e.message : e))).api(payload));
  if (IS_GOOGLE) return jsonpCall(payload);
  const res = await fetch(SERVER_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, // простой запрос без предварительного OPTIONS
    body: JSON.stringify(payload),
  });
  return res.json();
}

async function serverLog(record) {
  if (!SERVER_ON) return false;
  try {
    const data = await serverCall({ action: 'log', record });
    if (!data.ok) { lastServerError = data.error || 'неизвестная ошибка сервера'; return false; }
    lastServerError = null;
    return true;
  } catch (e) {
    lastServerError = 'Не удалось связаться с сервером: ' + (e && e.message ? e.message : e);
    return false;
  }
}

let mentorKey = null; // пароль преподавателя хранится только до закрытия вкладки
async function serverList() {
  if (!SERVER_ON) return null;
  if (!mentorKey) {
    mentorKey = (typeof window !== 'undefined' && window.prompt) ? window.prompt('Пароль преподавателя (ADMIN_KEY):') : null;
    if (!mentorKey) { lastServerError = 'Для просмотра результатов нужен пароль преподавателя'; return null; }
  }
  try {
    const data = await serverCall({ action: 'list', key: mentorKey });
    if (!data.ok) { mentorKey = null; lastServerError = data.error || 'неизвестная ошибка сервера'; return null; }
    lastServerError = null;
    return data.records || [];
  } catch (e) {
    lastServerError = 'Не удалось связаться с сервером: ' + (e && e.message ? e.message : e);
    return null;
  }
}

const hasPlatformStorage = () => typeof window !== 'undefined' && !!window.storage;
const memoryFallback = {};
let lastStorageError = null;
async function storageGet(key, shared) {
  if (hasPlatformStorage()) {
    try { const r = await window.storage.get(key, shared); lastStorageError = null; return r ? r.value : null; }
    catch (e) { lastStorageError = `get(${key}): ${e && e.message ? e.message : e}`; return null; }
  }
  const k = (shared ? 'shared:' : 'personal:') + key;
  return memoryFallback[k] !== undefined ? memoryFallback[k] : null;
}
async function storageSet(key, value, shared) {
  if (hasPlatformStorage()) {
    try { await window.storage.set(key, value, shared); lastStorageError = null; return true; }
    catch (e) { lastStorageError = `set(${key}): ${e && e.message ? e.message : e}`; return false; }
  }
  const k = (shared ? 'shared:' : 'personal:') + key;
  memoryFallback[k] = value;
  return true;
}

/* Простой чек-лист удалён по решению автора проекта — единственный инструмент для
   полезависимости/поленезависимости теперь тест включённых фигур (ниже), расширенный до 20 уровней. */

/* ==================== Тест включённых фигур — 10 уровней (было 6), с защитой от угадывания ====================
   Защита: 1) минимальное время просмотра перед засчитыванием клика, 2) кликабельные фигуры-обманки,
   3) фигура теперь ВИДНА (закамуфлирована линиями, как в настоящем тесте Уиткина), а не полностью невидима. */
const MIN_REVEAL_MS = 900;
const DIST_COLOR = "#B9B0A0";

function inflate(pointsStr, factor) {
  const pts = pointsStr.split(' ').map(p => p.split(',').map(Number));
  const cx = pts.reduce((s, p) => s + p[0], 0) / pts.length;
  const cy = pts.reduce((s, p) => s + p[1], 0) / pts.length;
  return pts.map(([x, y]) => `${cx + (x - cx) * factor},${cy + (y - cy) * factor}`).join(' ');
}
function shiftPoints(pointsStr, dx, dy) {
  return pointsStr.split(' ').map(p => {
    const [x, y] = p.split(',').map(Number);
    return `${(x + dx).toFixed(1)},${(y + dy).toFixed(1)}`;
  }).join(' ');
}
function centroidOf(pointsStr) {
  const pts = pointsStr.split(' ').map(p => p.split(',').map(Number));
  const cx = pts.reduce((s, p) => s + p[0], 0) / pts.length;
  const cy = pts.reduce((s, p) => s + p[1], 0) / pts.length;
  return [cx, cy];
}
function rotatePoints(pointsStr, deg, cx, cy) {
  const rad = (deg * Math.PI) / 180;
  return pointsStr.split(' ').map(p => {
    const [x, y] = p.split(',').map(Number);
    const dx = x - cx, dy = y - cy;
    const nx = cx + dx * Math.cos(rad) - dy * Math.sin(rad);
    const ny = cy + dx * Math.sin(rad) + dy * Math.cos(rad);
    return `${nx.toFixed(1)},${ny.toFixed(1)}`;
  }).join(' ');
}
function buildTrapTriangle(target, dx, dy, rot) {
  const shifted = shiftPoints(target, dx, dy);
  const [cx, cy] = centroidOf(shifted);
  return rotatePoints(shifted, rot || 0, cx, cy);
}

function renderDecoy(d, i, onWrong) {
  if (d.type === 'line') return <line key={i} fill="none" stroke={DIST_COLOR} strokeWidth="2" x1={d.x1} y1={d.y1} x2={d.x2} y2={d.y2} />;
  if (d.type === 'circle') return <circle key={i} cx={d.cx} cy={d.cy} r={d.r} fill="transparent" stroke={DIST_COLOR} strokeWidth="2" style={{cursor:'pointer'}} tabIndex={0} role="button" aria-label="Возможный вариант фигуры" onClick={(e) => { e.stopPropagation(); onWrong(); }} onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onWrong(); } }} />;
  if (d.type === 'rect') return <rect key={i} x={d.x} y={d.y} width={d.w} height={d.h} fill="transparent" stroke={DIST_COLOR} strokeWidth="2" transform={`rotate(${d.rot} ${d.x + d.w/2} ${d.y + d.h/2})`} style={{cursor:'pointer'}} tabIndex={0} role="button" aria-label="Возможный вариант фигуры" onClick={(e) => { e.stopPropagation(); onWrong(); }} onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onWrong(); } }} />;
  return null;
}

function FigureTest({ onDone }) {
  const [index, setIndex] = useState(0);
  const [results, setResults] = useState([]);
  const [feedback, setFeedback] = useState(null);
  const startRef = useRef(Date.now());

  useEffect(() => { startRef.current = Date.now(); setFeedback(null); }, [index]);

  function advance(next) {
    if (index < FIGURE_LEVELS.length - 1) setIndex(index + 1);
    else onDone(next);
  }

  function handleHit(isCorrect) {
    if (feedback === 'correct' || feedback === 'wrong') return;
    const elapsed = Date.now() - startRef.current;
    if (elapsed < MIN_REVEAL_MS) {
      setFeedback('tooFast');
      setTimeout(() => setFeedback(null), 550);
      return;
    }
    const next = [...results, { correct: isCorrect, timeMs: elapsed }];
    setResults(next);
    setFeedback(isCorrect ? 'correct' : 'wrong');
    setTimeout(() => advance(next), 650);
  }

  const level = FIGURE_LEVELS[index];
  const hitTarget = inflate(level.target, 1.05);
  const traps = (level.trapOffsets || []).map(t => buildTrapTriangle(level.target, t.dx, t.dy, t.rot));

  return (
    <div className="fig-wrap">
      <div className="fig-progress">
        {FIGURE_LEVELS.map((_, i) => (<div key={i} className={`fig-dot ${i < index ? 'done' : i === index ? 'active' : ''}`}></div>))}
      </div>
      <div className="fig-instruction">Найдите и коснитесь <b>спрятанного треугольника</b> — карточка {index + 1} из {FIGURE_LEVELS.length}. Похожих фигур несколько — верна только одна.</div>
      <div className="fig-stage">
        <svg viewBox="0 0 100 100" width="100%" height="100%" role="img" aria-label={`Визуальная головоломка ${index + 1} из ${FIGURE_LEVELS.length}`}>
          <rect x="0" y="0" width="100" height="100" fill="transparent" onClick={() => handleHit(false)} />
          {level.decoys.map((d, i) => renderDecoy(d, i, () => handleHit(false)))}
          {traps.map((pts, i) => (
            <polygon key={'trap'+i} points={pts} fill="transparent" stroke={DIST_COLOR} strokeWidth="2"
              style={{cursor:'pointer'}} tabIndex={0} role="button" aria-label="Возможный вариант фигуры"
              onClick={(e) => { e.stopPropagation(); handleHit(false); }}
              onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); handleHit(false); } }} />
          ))}
          <polygon points={level.target} fill="none" stroke={DIST_COLOR} strokeWidth="2" />
          <polygon points={hitTarget} fill="transparent" stroke="none" tabIndex={0} role="button" aria-label="Здесь спрятан треугольник — нажмите, если нашли" onClick={(e) => { e.stopPropagation(); handleHit(true); }} onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); handleHit(true); } }} />
        </svg>
      </div>
      <div className="fig-feedback" role="status" aria-live="polite">
        {feedback === 'correct' && '✓ Верно'}
        {feedback === 'wrong' && '· Не совсем — фиксируем и идём дальше'}
        {feedback === 'tooFast' && '· Слишком быстро — присмотритесь внимательнее'}
      </div>
      <div className="fig-hint">Засчитывается точность и скорость; среди похожих фигур верна только одна</div>
    </div>
  );
}

/* ==================== Тест сравнения похожих рисунков (Дж. Каган) — импульсивность/рефлексивность ====================
   Оригинальная методика: 2 тренировочных + 12 карточек, эталон вверху + 8 похожих вариантов внизу,
   только один идентичен эталону. Показатели: суммарное латентное время первого ответа + число ошибок
   (Каган, 1966; рус. адаптация — psylab.info). Здесь: 20 карточек для большей надёжности, эталон
   заменён абстрактной композицией фигур (реальные предметные рисунки Кагана защищены авторским правом),
   6 вариантов вместо 8 — тот же принцип "найди точную копию среди почти идентичных". */
const MATCH_SHAPES = ['circle', 'square', 'triangle', 'diamond'];
const MATCH_COLORS = ['#0F6B5C', '#E1673F', '#B4790E', '#6B4FA0', '#2E6FA3'];
const MATCH_SLOT_POS = [{ x: 25, y: 50 }, { x: 50, y: 50 }, { x: 75, y: 50 }];

function standardFor(i) {
  return MATCH_SLOT_POS.map((pos, k) => ({
    shape: MATCH_SHAPES[(i * 2 + k * 3 + 1) % MATCH_SHAPES.length],
    color: MATCH_COLORS[(i * 3 + k * 2 + 2) % MATCH_COLORS.length],
    rot: (i * 40 + k * 25) % 360,
    x: pos.x, y: pos.y,
  }));
}
function alterVariant(standard, i, j) {
  const copy = standard.map(s => ({ ...s }));
  const slot = (i + j) % copy.length;
  const attr = j % 3;
  if (attr === 0) { const idx = MATCH_COLORS.indexOf(copy[slot].color); copy[slot].color = MATCH_COLORS[(idx + 1 + j) % MATCH_COLORS.length]; }
  else if (attr === 1) { const idx = MATCH_SHAPES.indexOf(copy[slot].shape); copy[slot].shape = MATCH_SHAPES[(idx + 1 + j) % MATCH_SHAPES.length]; }
  else { copy[slot].rot = (copy[slot].rot + 90 + j * 10) % 360; }
  return copy;
}
function buildMatchTrial(i) {
  const standard = standardFor(i);
  const variants = [0, 1, 2, 3, 4].map(j => alterVariant(standard, i, j));
  const correctSlot = (i * 3 + 2) % 6;
  const options = []; let vi = 0;
  for (let s = 0; s < 6; s++) {
    if (s === correctSlot) options.push({ pattern: standard, correct: true });
    else { options.push({ pattern: variants[vi], correct: false }); vi++; }
  }
  return { standard, options };
}
const MATCH_TRIALS = Array.from({ length: 20 }, (_, i) => buildMatchTrial(i));

function renderMatchShape(s, key) {
  const t = `rotate(${s.rot} ${s.x} ${s.y})`;
  if (s.shape === 'circle') return <circle key={key} cx={s.x} cy={s.y} r="9" fill={s.color} transform={t} />;
  if (s.shape === 'square') return <rect key={key} x={s.x - 8} y={s.y - 8} width="16" height="16" fill={s.color} transform={t} />;
  if (s.shape === 'triangle') return <polygon key={key} points={`${s.x},${s.y - 10} ${s.x + 9},${s.y + 8} ${s.x - 9},${s.y + 8}`} fill={s.color} transform={t} />;
  return <polygon key={key} points={`${s.x},${s.y - 10} ${s.x + 8},${s.y} ${s.x},${s.y + 10} ${s.x - 8},${s.y}`} fill={s.color} transform={t} />;
}
function PatternSvg({ pattern, size }) {
  return (<svg viewBox="0 0 100 100" width={size} height={size}>{pattern.map((s, i) => renderMatchShape(s, i))}</svg>);
}

function MatchTest({ onDone }) {
  const [index, setIndex] = useState(0);
  const [results, setResults] = useState([]);
  const [errorsThisTrial, setErrorsThisTrial] = useState(0);
  const [feedback, setFeedback] = useState(null);
  const [answered, setAnswered] = useState(false);
  const startRef = useRef(Date.now());

  useEffect(() => { startRef.current = Date.now(); setErrorsThisTrial(0); setFeedback(null); setAnswered(false); }, [index]);

  const trial = MATCH_TRIALS[index];

  function handlePick(opt) {
    if (answered) return;
    if (opt.correct) {
      const elapsed = Date.now() - startRef.current;
      const next = [...results, { timeMs: elapsed, errors: errorsThisTrial }];
      setResults(next);
      setFeedback('correct');
      setAnswered(true);
      setTimeout(() => { if (index < MATCH_TRIALS.length - 1) setIndex(index + 1); else onDone(next); }, 500);
    } else {
      setErrorsThisTrial(e => e + 1);
      setFeedback('wrong');
      setTimeout(() => setFeedback(null), 350);
    }
  }

  return (
    <div className="fig-wrap">
      <div className="fig-progress">
        {MATCH_TRIALS.map((_, i) => (<div key={i} className={`fig-dot ${i < index ? 'done' : i === index ? 'active' : ''}`}></div>))}
      </div>
      <div className="fig-instruction">Наверху — образец. Найдите внизу <b>точно такой же</b> набор фигур среди похожих — карточка {index + 1} из {MATCH_TRIALS.length}.</div>
      <div className="match-standard"><PatternSvg pattern={trial.standard} size={110} /></div>
      <div className="match-grid">
        {trial.options.map((opt, i) => (
          <button key={i} className="match-option" onClick={() => handlePick(opt)} aria-label={`Вариант ${i + 1}`}>
            <PatternSvg pattern={opt.pattern} size={68} />
          </button>
        ))}
      </div>
      <div className="fig-feedback" role="status" aria-live="polite">
        {feedback === 'correct' && '✓ Верно'}
        {feedback === 'wrong' && '· Не то — попробуйте ещё'}
      </div>
      <div className="fig-hint">Считается время до первого верного ответа и число ошибок на каждой карточке</div>
    </div>
  );
}

/* ==================== Тест словесно-цветовой интерференции (Струп) — гибкость/ригидность контроля ====================
   Оригинал: 3 карточки (слова / цвета / цветные слова), показатель ригидности = разница времени
   T3−T2 (Дельбош/Струп; рус. адаптация — psylab.info, показатель Д. Бровермана). Здесь — интерактивная
   адаптация под поштучные пробы с измерением времени реакции (стандартная практика компьютеризированных
   версий теста Струпа): смесь конгруэнтных и неконгруэнтных проб, интерференция = разница среднего
   времени ответа на неконгруэнтных и конгруэнтных пробах. */
const STROOP_COLOR_HEX = { 'красный': '#C2483A', 'синий': '#2E6FA3', 'зелёный': '#1E8E5A', 'жёлтый': '#B4900E' };
const STROOP_COLOR_NAMES = Object.keys(STROOP_COLOR_HEX);
const STROOP_TRIALS = [
  { word: 'красный', ink: 'красный' }, { word: 'синий', ink: 'жёлтый' }, { word: 'зелёный', ink: 'синий' }, { word: 'жёлтый', ink: 'зелёный' },
  { word: 'синий', ink: 'синий' }, { word: 'красный', ink: 'зелёный' }, { word: 'жёлтый', ink: 'красный' }, { word: 'зелёный', ink: 'жёлтый' },
  { word: 'синий', ink: 'красный' }, { word: 'зелёный', ink: 'зелёный' }, { word: 'красный', ink: 'синий' }, { word: 'жёлтый', ink: 'жёлтый' },
  { word: 'синий', ink: 'зелёный' }, { word: 'зелёный', ink: 'красный' }, { word: 'красный', ink: 'жёлтый' }, { word: 'жёлтый', ink: 'синий' },
  { word: 'синий', ink: 'жёлтый' }, { word: 'зелёный', ink: 'зелёный' }, { word: 'красный', ink: 'красный' }, { word: 'жёлтый', ink: 'зелёный' },
];

function StroopTest({ onDone }) {
  const [index, setIndex] = useState(0);
  const [results, setResults] = useState([]);
  const [feedback, setFeedback] = useState(null);
  const startRef = useRef(Date.now());

  useEffect(() => { startRef.current = Date.now(); setFeedback(null); }, [index]);

  const trial = STROOP_TRIALS[index];
  const congruent = trial.word === trial.ink;

  function handlePick(colorName) {
    if (feedback) return;
    const elapsed = Date.now() - startRef.current;
    const correct = colorName === trial.ink;
    const next = [...results, { correct, timeMs: elapsed, congruent }];
    setResults(next);
    setFeedback(correct ? 'correct' : 'wrong');
    setTimeout(() => { if (index < STROOP_TRIALS.length - 1) setIndex(index + 1); else onDone(next); }, 350);
  }

  return (
    <div className="fig-wrap">
      <div className="fig-progress">
        {STROOP_TRIALS.map((_, i) => (<div key={i} className={`fig-dot ${i < index ? 'done' : i === index ? 'active' : ''}`}></div>))}
      </div>
      <div className="fig-instruction">Нажмите кнопку с цветом, которым <b>написано слово</b> — не с тем цветом, что оно означает. Проба {index + 1} из {STROOP_TRIALS.length}.</div>
      <div className="stroop-word" style={{ color: STROOP_COLOR_HEX[trial.ink] }}>{trial.word.toUpperCase()}</div>
      <div className="stroop-buttons">
        {STROOP_COLOR_NAMES.map(name => (
          <button key={name} className="stroop-btn" style={{ background: STROOP_COLOR_HEX[name] }} onClick={() => handlePick(name)} aria-label={name}></button>
        ))}
      </div>
      <div className="fig-feedback" role="status" aria-live="polite">
        {feedback === 'correct' && '✓ Верно'}
        {feedback === 'wrong' && '· Неверно'}
      </div>
      <div className="fig-hint">Отвечайте как можно быстрее, ориентируясь именно на цвет букв</div>
    </div>
  );
}

function buildReport(dimension, style, subject, topic) {
  const tipsSet = TIPS_BY_DIM[dimension] || TIPS_FDFI;
  const base = tipsSet[style] || tipsSet["смешанный"];
  const subjTips = dimension === 'fdfi' ? ((SUBJECT_TIPS[subject] && SUBJECT_TIPS[subject][style]) || null) : null;
  const heading = (dimension === 'fdfi' && topic) ? `Рекомендации для темы «${topic}» (${subject})` : `Общие рекомендации по стилю`;
  return { heading, base, subjTips };
}

const PE_ASPECT_LABELS = { method: 'Метод', exercises: 'Упражнения', form: 'Форма организации', feedback: 'Обратная связь', avoid: 'Чего избегать', extra: 'Дополнительно' };
const PE_ASPECT_ORDER = ['method', 'exercises', 'form', 'feedback', 'avoid', 'extra'];

function buildPeCard(sport, topic, style) {
  const d = PE_TOPIC_DATA[sport] && PE_TOPIC_DATA[sport][topic] && PE_TOPIC_DATA[sport][topic][style];
  if (!d) return null;
  const blocks = PE_ASPECT_ORDER.filter(k => d[k] && d[k] !== '—').map(k => ({ label: PE_ASPECT_LABELS[k], text: d[k] }));
  return { sport, topic, blocks };
}

  useEffect(() => {
    (async () => {
      const raw = await storageGet('teacher-profile', false);
      if (raw) { try { setTeacherProfile(JSON.parse(raw)); } catch (e) {} }
    })();
  }, []);

  function computeFdfiResult(results) {
    const correctCount = results.filter(r => r.correct).length;
    const avgTime = results.reduce((s, r) => s + r.timeMs, 0) / results.length;
    const accuracy = correctCount / results.length;
    const speedScore = Math.max(0, Math.min(1, 1 - (avgTime - MIN_REVEAL_MS) / 9000));
    const combined = accuracy * 100 * 0.6 + speedScore * 100 * 0.4;
    const low = combined > 40 && combined < 60;
    let style;
    if (combined >= 60) style = 'поленезависимый';
    else if (combined <= 40) style = 'полезависимый';
    else style = 'смешанный';
    return { style, pct: Math.round(combined), low, detail: `точность ${Math.round(accuracy * 100)}%` };
  }

  function computeIrResult(results) {
    const totalTimeMs = results.reduce((s, r) => s + r.timeMs, 0);
    const totalErrors = results.reduce((s, r) => s + r.errors, 0);
    const avgTime = totalTimeMs / results.length;
    const avgErrors = totalErrors / results.length;
    const speedScore = Math.max(0, Math.min(1, (avgTime - 1200) / 7000));
    const errorScore = Math.max(0, Math.min(1, avgErrors / 2.5));
    const impulsivity = (1 - speedScore) * 0.5 + errorScore * 0.5;
    const pct = Math.round(impulsivity * 100);
    const low = pct > 40 && pct < 60;
    let style;
    if (pct >= 60) style = 'импульсивный';
    else if (pct <= 40) style = 'рефлексивный';
    else style = 'смешанный';
    return { style, pct, low, detail: `в среднем ${avgErrors.toFixed(1)} ошибок на карточку` };
  }

  function computeFrcResult(results) {
    const congr = results.filter(r => r.congruent);
    const incongr = results.filter(r => !r.congruent);
    const avg = arr => arr.length ? arr.reduce((s, r) => s + r.timeMs, 0) / arr.length : 0;
    const avgCongr = avg(congr) || 1;
    const avgIncongr = avg(incongr) || avgCongr;
    const interferenceMs = Math.max(0, avgIncongr - avgCongr);
    const interferenceRatio = interferenceMs / avgCongr;
    const errorsIncongr = incongr.length ? incongr.filter(r => !r.correct).length / incongr.length : 0;
    const rigidityIndex = Math.min(1, interferenceRatio / 0.8) * 0.7 + Math.min(1, errorsIncongr) * 0.3;
    const pct = Math.round(rigidityIndex * 100);
    const low = pct > 35 && pct < 60;
    let style;
    if (pct >= 60) style = 'ригидный';
    else if (pct <= 35) style = 'гибкий';
    else style = 'смешанный';
    return { style, pct, low, detail: `интерференция +${Math.round(interferenceMs)} мс` };
  }

  async function logSubmission(record) {
    if (hasSubmittedRef.current) return true;

    const raw = await storageGet('submissions-log', true);
    let arr = [];
    if (raw) { try { arr = JSON.parse(raw); } catch (e) { arr = []; } }
    arr.push(fullRecord);
    if (arr.length > 500) arr = arr.slice(arr.length - 500);

            const tips = (STUDENT_TIPS[dim][st] || STUDENT_TIPS[dim]['смешанный']);
            return (
              <React.Fragment key={dim}>
                <div className="tip-group-label">{DIMENSIONS[dim].label}: {st}</div>
                <ul className="tip-list">{tips.map((t, i) => (<li key={dim + i}><div className="tip-num">{i+1}</div><div>{t}</div></li>))}</ul>
              </React.Fragment>
            );
          })}
          <div className="confidence-note" style={{marginTop: 6}}>
            {submitting ? 'Сохраняем результат…' : (SERVER_ON && !lastServerError ? 'Результат сохранён. Он появится в вашем отчёте КогнитоПульса на замере.' : 'Результат никуда не отправляется и остаётся только на этом устройстве.')}
          </div>
          <div style={{marginTop: 16}}><button className="ghost" onClick={reset}>Готово</button></div>
        </div>
      )}

      {stage === 'result' && role === 'teacher' && (() => {
        const fdfiRefl = TEACHER_REFLECTION_FDFI[fdfiResult.style] || [];
        const irRefl = TEACHER_REFLECTION_IR[irResult.style] || [];
        const frcRefl = TEACHER_REFLECTION_FRC[frcResult.style] || [];
        return (
          <div className="card" key="result-teacher">
            <div className="card-desc" style={{marginBottom: 10}}>{fio} · {group}</div>
            <div className="tip-group-label">Ваш индивидуальный профиль педагога</div>
            <ProfileGrid fdfi={fdfiResult} ir={irResult} frc={frcResult} />

            <div className="tip-group-label">{DIMENSIONS.fdfi.label}</div>
            <ul className="tip-list">{fdfiRefl.map((t, i) => (<li key={'a'+i}><div className="tip-num">{i+1}</div><div>{t}</div></li>))}</ul>

            <div className="tip-group-label">{DIMENSIONS.ir.label}</div>
            <ul className="tip-list">{irRefl.map((t, i) => (<li key={'b'+i}><div className="tip-num">{i+1}</div><div>{t}</div></li>))}</ul>

            <div className="tip-group-label">{DIMENSIONS.frc.label}</div>
            <ul className="tip-list">{frcRefl.map((t, i) => (<li key={'c'+i}><div className="tip-num">{i+1}</div><div>{t}</div></li>))}</ul>

            <div className="card-desc" style={{marginTop: 14}}>Профиль сохранён на этом устройстве. В «Кабинете преподавателя» вы выберете группу, вид спорта и тему занятия — и получите рекомендации для своих студентов с пометками, где ваш стиль с ними расходится.</div>
            <div style={{display:'flex', gap: 10, marginTop: 10, flexWrap:'wrap'}}>
              <button className="primary" style={{marginTop: 0}} onClick={openMentor}>Открыть кабинет преподавателя</button>
              <button className="ghost" onClick={reset}>Пройти заново</button>
            </div>
          </div>
        );
      })()}

      {stage === 'mentor' && (() => {
        const all = (mentorStats && mentorStats.raw) || [];
        const latest = {};
        all.filter(r => r.role === 'student' && r.fio).forEach(r => {
          const k = (r.fio + '|' + (r.group || '')).trim().toLowerCase();
          if (!latest[k] || (r.ts || 0) > (latest[k].ts || 0)) latest[k] = r;
        });
        const students = Object.values(latest);
        const groups = Array.from(new Set(students.map(r => r.group || '—'))).sort();
        const inGroup = wsGroup ? students.filter(r => (r.group || '—') === wsGroup).sort((x, y) => String(x.fio).localeCompare(String(y.fio), 'ru', { numeric: true })) : [];
        const tp = teacherProfile;
        const topicReady = wsSport && wsTopic;
        const card = (style) => topicReady ? buildPeCard(wsSport, wsTopic, style) : null;
        const PeBlocks = ({ c }) => (
          <div className="pe-card">{c.blocks.map((b, i) => (<div className="pe-aspect" key={i}><div className="pe-aspect-label">{b.label}</div><div className="pe-aspect-text">{b.text}</div></div>))}</div>
        );
        const GeneralFdfi = ({ style }) => {
          const t = (SUBJECT_TIPS['Физическая культура'][style] || []).concat((TIPS_FDFI[style] || []).slice(0, 2));
          return <ul className="tip-list">{t.map((x, i) => (<li key={i}><div className="tip-num">{i+1}</div><div>{x}</div></li>))}</ul>;
        };
        const label = (r) => r.fio;
        const names = (list) => list.map(label).join(', ');
        const byStyle = (dim) => {
          const out = {};
          STYLE_ORDER[dim].forEach(st => { out[st] = inGroup.filter(r => r[REC_KEY[dim]] === st); });
          return out;
        };
        const student = inGroup.find(r => r.fio === wsStudent);
        return (
          <div className="card" key="mentor">
            <div className="eyebrow">Кабинет преподавателя</div>
            <div className="card-title">Рекомендации к занятию под стили студентов</div>
            {mentorLoading && <div className="card-desc">Загрузка результатов студентов…</div>}
            {!mentorLoading && mentorStats && (
              <React.Fragment>
                {tp ? (
                  <div className="meta-chip" style={{display:'inline-block', marginBottom: 12}}>Ваш профиль: {tp.fdfi} · {tp.ir} · {tp.frc}</div>
                ) : (
                  <div className="confidence-note" style={{marginBottom: 12}}>Пройдите диагностику как педагог на этом устройстве — тогда здесь появятся пометки, где ваш стиль расходится со стилем студентов.</div>
                )}

                <div className="ws-tabs">
                  <button className={wsMode === 'group' ? 'ws-tab active' : 'ws-tab'} onClick={() => setWsMode('group')}>Вся группа</button>
                  <button className={wsMode === 'student' ? 'ws-tab active' : 'ws-tab'} onClick={() => setWsMode('student')}>Один студент</button>
                  <button className={wsMode === 'summary' ? 'ws-tab active' : 'ws-tab'} onClick={() => setWsMode('summary')}>Сводка и выгрузка</button>
                </div>

                {wsMode !== 'summary' && (
                  <React.Fragment>
                    <label className="field-label" htmlFor="ws-group">Учебная группа</label>
                    <select id="ws-group" value={wsGroup} onChange={e => { setWsGroup(e.target.value); setWsStudent(''); }}>
                      <option value="">— выберите —</option>
                      {groups.map(g => (<option key={g} value={g}>{g} ({students.filter(r => (r.group || '—') === g).length} студ.)</option>))}
                    </select>
                    {groups.length === 0 && <div className="card-desc">Пока нет результатов студентов. Попросите студентов пройти тесты (роль «Я — студент») и нажмите «Обновить».</div>}

                    <label className="field-label" htmlFor="ws-sport">Вид спорта / раздел программы</label>
                    <select id="ws-sport" value={wsSport} onChange={e => { setWsSport(e.target.value); setWsTopic(''); }}>
                      <option value="">— без темы: общие рекомендации —</option>
                      {Object.keys(PE_SPORTS).map(sp => (<option key={sp} value={sp}>{sp}</option>))}
                    </select>
                    {wsSport && (
                      <React.Fragment>
                        <label className="field-label" htmlFor="ws-topic">Тема занятия</label>
                        <select id="ws-topic" value={wsTopic} onChange={e => setWsTopic(e.target.value)}>
                          <option value="">— выберите —</option>
                          {PE_SPORTS[wsSport].map(t => (<option key={t} value={t}>{t}</option>))}
                        </select>
                      </React.Fragment>
                    )}
                  </React.Fragment>
                )}

                {wsMode === 'group' && wsGroup && inGroup.length > 0 && (() => {
                  const f = byStyle('fdfi'), ir = byStyle('ir'), fr = byStyle('frc');
                  const fPresent = STYLE_ORDER.fdfi.filter(st => f[st].length);
                  const mixedGroup = (f['полезависимый'].length && f['поленезависимый'].length) || f['смешанный'].length;
                  return (
                    <React.Fragment>
                      <div className="tip-group-label">Состав группы «{wsGroup}» — {inGroup.length} уч.</div>
                      {['fdfi', 'ir', 'frc'].map(dim => {
                        const g = byStyle(dim);
                        return (
                          <div className="ws-dist" key={dim}>
                            <div className="ws-dist-title">{DIMENSIONS[dim].label}</div>
                            {STYLE_ORDER[dim].filter(st => g[st].length).map(st => (
                              <div className="stat-row" key={st}><span><b>{st}</b> — {g[st].length}{tp && tp[dim] === st ? ' (как вы)' : ''}</span><span className="ws-names">{names(g[st])}</span></div>
                            ))}
                          </div>
                        );
                      })}

                      <div className="tip-group-label">{topicReady ? `План занятия: ${wsSport} — «${wsTopic}»` : 'Как вести занятие (общие рекомендации)'}</div>
                      {mixedGroup && fPresent.length > 1 ? (
                        <React.Fragment>
                          <div className="card-desc">В группе разные стили восприятия — основу занятия стройте по комбинированной схеме, а для подгрупп добавьте приёмы ниже.</div>
                          {topicReady && card('смешанный') ? <PeBlocks c={card('смешанный')} /> : <GeneralFdfi style="смешанный" />}
                        </React.Fragment>
                      ) : null}
                      {fPresent.filter(st => !(mixedGroup && fPresent.length > 1 && st === 'смешанный')).map(st => (
                        <React.Fragment key={st}>
                          <div className="ws-sub">Для подгруппы «{st}» ({f[st].length}): {names(f[st])}</div>
                          {topicReady && card(st) ? <PeBlocks c={card(st)} /> : <GeneralFdfi style={st} />}
                        </React.Fragment>
                      ))}

                      <div className="tip-group-label">Темп: импульсивность / рефлексивность</div>
                      {STYLE_ORDER.ir.filter(st => ir[st].length).map(st => (
                        <React.Fragment key={st}>
                          <div className="ws-sub">{st} ({ir[st].length})</div>
                          <ul className="tip-list">{(TIPS_IR[st] || []).slice(0, 2).map((t, i) => (<li key={i}><div className="tip-num">{i+1}</div><div>{t}</div></li>))}</ul>
                        </React.Fragment>
                      ))}
                      <div className="tip-group-label">Переключение: гибкость / ригидность</div>
                      {STYLE_ORDER.frc.filter(st => fr[st].length).map(st => (
                        <React.Fragment key={st}>
                          <div className="ws-sub">{st} ({fr[st].length})</div>
                          <ul className="tip-list">{(TIPS_FRC[st] || []).slice(0, 2).map((t, i) => (<li key={i}><div className="tip-num">{i+1}</div><div>{t}</div></li>))}</ul>
                        </React.Fragment>
                      ))}

                      {tp && (() => {
                        const diff = ['fdfi', 'ir', 'frc'].map(dim => ({ dim, n: inGroup.filter(r => r[REC_KEY[dim]] && r[REC_KEY[dim]] !== tp[dim]).length })).filter(x => x.n);
                        return diff.length ? (
                          <div className="mismatch-box" style={{marginTop: 14}}>
                            <b>Где ваш стиль расходится с группой:</b>{' '}
                            {diff.map(x => `${DIMENSIONS[x.dim].label.toLowerCase()} — у ${x.n} из ${inGroup.length} студ.`).join('; ')}.
                            {' '}Проверьте, что в плане занятия есть формат и для них, а не только привычный вам.
                          </div>
                        ) : null;
                      })()}
                    </React.Fragment>
                  );
                })()}

                {wsMode === 'student' && wsGroup && (
                  <React.Fragment>
                    <label className="field-label" htmlFor="ws-student">{COLLECT_FIO ? 'Студент' : 'Студент (код участника)'}</label>
                    <select id="ws-student" value={wsStudent} onChange={e => setWsStudent(e.target.value)}>
                      <option value="">— выберите —</option>
                      {inGroup.map(r => (<option key={r.fio} value={r.fio}>{label(r)}</option>))}
                    </select>
                    {student && (
                      <React.Fragment>
                        <div className="profile-grid" style={{marginTop: 12}}>
                          {['fdfi', 'ir', 'frc'].map(dim => (
                            <div className="profile-chip" key={dim}><b>{student[REC_KEY[dim]] || '—'}</b><span>{DIMENSIONS[dim].label}</span></div>
                          ))}
                        </div>
                        <div className="tip-group-label">{topicReady ? `${wsSport} — «${wsTopic}»` : 'Как объяснять новое (общие рекомендации)'}</div>
                        {topicReady && card(student.fdfiStyle) ? <PeBlocks c={card(student.fdfiStyle)} /> : <GeneralFdfi style={student.fdfiStyle || 'смешанный'} />}
                        <div className="tip-group-label">Темп ({student.irStyle})</div>
                        <ul className="tip-list">{(TIPS_IR[student.irStyle] || TIPS_IR['смешанный']).slice(0, 3).map((t, i) => (<li key={i}><div className="tip-num">{i+1}</div><div>{t}</div></li>))}</ul>
                        <div className="tip-group-label">Переключение ({student.frcStyle})</div>
                        <ul className="tip-list">{(TIPS_FRC[student.frcStyle] || TIPS_FRC['смешанный']).slice(0, 3).map((t, i) => (<li key={i}><div className="tip-num">{i+1}</div><div>{t}</div></li>))}</ul>
                        {tp && (() => {
                          const diff = ['fdfi', 'ir', 'frc'].filter(dim => student[REC_KEY[dim]] && student[REC_KEY[dim]] !== tp[dim]);
                          return (
                            <div className="mismatch-box" style={{marginTop: 14}}>
                              <b>Сравнение с вашим стилем:</b>{' '}
                              {diff.length
                                ? diff.map(dim => `${DIMENSIONS[dim].label.toLowerCase()}: у вас — ${tp[dim]}, у студента — ${student[REC_KEY[dim]]}`).join('; ') + '. Здесь есть риск объяснять «под себя» — опирайтесь на рекомендации выше.'
                                : 'стили совпадают по всем трём измерениям — привычная вам подача, скорее всего, подойдёт этому студенту.'}
                            </div>
                          );
                        })()}
                      </React.Fragment>
                    )}
                  </React.Fragment>
                )}

                {wsMode === 'summary' && (
                  <React.Fragment>
                    <div className="big-num">{mentorStats.total}</div>
                    <div className="card-desc" style={{marginBottom: 8}}>диагностик всего (студенты и педагоги)</div>
                    <div className="tip-group-label">По группам</div>
                    {Object.keys(mentorStats.byGroup).length === 0 && <div className="card-desc">Пока нет данных.</div>}
                    {Object.entries(mentorStats.byGroup).map(([k, v]) => (<div className="stat-row" key={k}><span>{k}</span><span>{v} чел.</span></div>))}
                    <div className="tip-group-label">Полезависимость / поленезависимость</div>
                    {Object.entries(mentorStats.byFdfi).map(([k, v]) => (<div className="stat-row" key={k}><span>{k}</span><span>{v}</span></div>))}
                    <div className="tip-group-label">Импульсивность / рефлексивность</div>
                    {Object.entries(mentorStats.byIr).map(([k, v]) => (<div className="stat-row" key={k}><span>{k}</span><span>{v}</span></div>))}
                    <div className="tip-group-label">Гибкость / ригидность контроля</div>
                    {Object.entries(mentorStats.byFrc).map(([k, v]) => (<div className="stat-row" key={k}><span>{k}</span><span>{v}</span></div>))}
                    <div style={{marginTop: 14}}><button className="ghost" onClick={downloadCsv} disabled={mentorStats.total === 0}>Скачать CSV</button></div>
                  </React.Fragment>
                )}

                <div style={{display:'flex', gap: 10, marginTop: 18, flexWrap:'wrap'}}>
                  <button className="ghost" onClick={openMentor}>Обновить</button>
                  <button className="ghost" onClick={() => setStage('role')}>На главную</button>
                </div>
                <div className="meta-chip" style={{display:'inline-block', marginTop: 14}}>
                  Источник данных: {mentorStats.usedServer ? 'сервер (результаты со всех устройств)' : 'только это устройство'}
                </div>
                {!SERVER_ON && (
                  <div className="confidence-note" style={{marginTop: 10}}>
                    Сохранение на сервер не подключено — видны только тесты, пройденные на этом устройстве. Подключите Google Таблицу по инструкции.
                  </div>
                )}
                {(lastStorageError || lastServerError) && (
                  <div className="confidence-note" style={{marginTop: 10, color: "#C2483A", background: "#FBEAE6"}}>
                    Ошибка: {lastServerError || lastStorageError}
                  </div>
                )}
              </React.Fragment>
            )}
          </div>
        );
      })()}

      <div className="footer-note">
        MVP-прототип проекта «КогнитивноГид» (КИВО-2026). Три теста проходятся подряд и формируют единый индивидуальный профиль: полезависимость/поленезависимость — тест включённых фигур (Г. Уиткин, 1954, 20 уровней; упрощённая иллюстрация, для итоговой версии рекомендуется GEFT/АКТ-70); импульсивность/рефлексивность — по принципу теста сравнения похожих рисунков (MFFT, Дж. Каган; латентное время первого ответа + число ошибок); гибкость/ригидность познавательного контроля — по принципу словесно-цветовой интерференции (тест Струпа; интерференция = разница времени на неконгруэнтных и конгруэнтных пробах). Стимульный материал Кагана и Струпа адаптирован под интерактивный веб-формат, не является точной копией бланковых методик. Рекомендации по физической культуре (59 тем, 13 видов спорта) опираются на Холодов Ж.К., Кузнецов В.С. «Теория и методика физического воспитания и спорта»; Ашмарин Б.А. «Теория и методика физического воспитания» (1990); Боген М.М. «Обучение двигательным действиям»; Ильин Е.П. «Психология спорта» — и берутся за основу маршрута; рекомендации по импульсивности/рефлексивности и гибкости/ригидности контроля — общепедагогические, без привязки к конкретному виду спорта. Пороги классификации по всем трём тестам подобраны эвристически и требуют калибровки на реальной выборке в ходе пилота.
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
